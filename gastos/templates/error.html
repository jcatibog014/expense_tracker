{% extends "base.html" %}
{% block title %}Oops · {{ APP_NAME }}{% endblock %}
{% block content %}
<section class="card narrow error-card">
  <h1>Oops! <span class="muted">({{ code }})</span></h1>
  <p>{{ message }}</p>
  <p><a href="{{ url_for('main.home') }}">Back to the home page</a></p>
</section>
{% endblock %}
